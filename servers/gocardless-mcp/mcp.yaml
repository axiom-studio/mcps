name: GoCardless
summary: GoCardless helps developers build payment API integrations for bank payments and payment workflows. Its connector brings GoCardless documentation and integration context into assistant workflows for implementation planning and troubleshooting.
description: |-
  GoCardless helps developers build payment API integrations for bank payments and payment workflows. Its connector brings GoCardless documentation and integration context into assistant workflows for implementation planning and troubleshooting.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://docs.gocardless.com/docs/developer-resources/mcp)
category: finance
tags:
  - finance
  - remote-mcp
official: true
registry_name: com.gocardless/gc-mcp
docs_url: https://docs.gocardless.com/docs/developer-resources/mcp
endpoints:
  - url: https://mcp.gocardless.com
    transport: streamable-http
    auth: oauth
