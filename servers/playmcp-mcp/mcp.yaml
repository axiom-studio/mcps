name: PlayMCP
summary: PlayMCP is a catalog and connection layer for MCP servers, including Kakao services. Its hosted remote MCP connector lets users add services registered in PlayMCP to an assistant toolbox and use their tools through one connection.
description: |-
  PlayMCP is a catalog and connection layer for MCP servers, including Kakao services. Its hosted remote MCP connector lets users add services registered in PlayMCP to an assistant toolbox and use their tools through one connection.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/playmcp)
category: other
tags:
  - other
  - remote-mcp
official: true
docs_url: https://claude.com/connectors/playmcp
endpoints:
  - url: https://playmcp.kakao.com/mcp
    transport: streamable-http
    auth: oauth
