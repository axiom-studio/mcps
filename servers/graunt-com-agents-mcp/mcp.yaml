name: Graunt
summary: 'Graunt is the agent-native marketplace for AI data. Its remote MCP server lets your agent search the public catalog, read each listing''s price and seller-declared rights (training, redistribution, citation), check content hashes, and get the files of free listings that need no account. Read-only, no key, nothing to install: https://api.graunt.com/v1/mcp'
category: search
tags:
  - ai-agent
  - data-analysis
  - marketplace
  - search
docs_url: https://graunt.com/agents/mcp
endpoints:
  - url: https://api.graunt.com/v1/mcp
    transport: streamable-http
    auth: none
