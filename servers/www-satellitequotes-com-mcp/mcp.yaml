name: SatelliteQuotes
summary: Measure any property from satellite imagery and price the job across 24 trades - roofing, fencing, paving, turf, siding, solar and more (roof pitch multiplier applied for you). Also installs an instant-quote widget on a contractor's website and verifies the install on the live page. Read-only, no API key.
