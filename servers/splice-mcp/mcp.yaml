name: Splice
summary: Splice provides discovery and ideation tools for music creators using its catalog of royalty-free samples. Its MCP server helps assistants search sounds with natural language and build stacks of complementary sounds for new projects.
description: |-
  Splice provides discovery and ideation tools for music creators using its catalog of royalty-free samples. Its MCP server helps assistants search sounds with natural language and build stacks of complementary sounds for new projects.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://support.splice.com/en/articles/14442749-getting-started-with-the-splice-mcp-server-beta)
