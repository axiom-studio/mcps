name: Fellow.ai
summary: Fellow.ai is a meeting management platform that captures transcripts, summaries, decisions, and follow-ups. Its remote MCP server lets assistants search meeting history, retrieve key insights, and track action items using natural-language queries.
description: |-
  Fellow.ai is a meeting management platform that captures transcripts, summaries, decisions, and follow-ups. Its remote MCP server lets assistants search meeting history, retrieve key insights, and track action items using natural-language queries.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

