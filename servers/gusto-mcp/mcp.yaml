name: Gusto
summary: Gusto is a payroll, benefits, and HR platform for small and mid-sized businesses. Its remote MCP server gives assistants account-backed access to payroll and people data so compensation, time-off, and workforce questions can be answered from the system of record.
description: |-
  Gusto is a payroll, benefits, and HR platform for small and mid-sized businesses. Its remote MCP server gives assistants account-backed access to payroll and people data so compensation, time-off, and workforce questions can be answered from the system of record.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://docs.gusto.com/app-integrations/docs/mcp)
category: productivity
tags:
  - productivity
  - remote-mcp
official: true
docs_url: https://docs.gusto.com/app-integrations/docs/mcp
endpoints:
  - url: https://mcp.api.gusto.com/anthropic
    transport: streamable-http
    auth: oauth
