name: Medidata
summary: Medidata provides software and data for clinical trials. Its remote MCP server answers product questions across tools such as Rave EDC and Clinical Data Studio, and helps eligible users rank trial sites against enrollment goals during protocol planning.
description: |-
  Medidata provides software and data for clinical trials. Its remote MCP server answers product questions across tools such as Rave EDC and Clinical Data Studio, and helps eligible users rank trial sites against enrollment goals during protocol planning.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/medidata)
category: other
tags:
  - other
  - remote-mcp
official: true
docs_url: https://claude.com/connectors/medidata
endpoints:
  - url: https://mcp.imedidata.com/mcp
    transport: streamable-http
    auth: oauth
