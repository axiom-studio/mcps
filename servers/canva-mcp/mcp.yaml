name: Canva
summary: Canva is a visual communication platform for creating presentations, social graphics, documents, and brand assets. Its remote MCP server connects assistants to Canva designs, assets, exports, and comments so creative work can be discussed, revised, and prepared from conversation.
description: |-
  Canva is a visual communication platform for creating presentations, social graphics, documents, and brand assets. Its remote MCP server connects assistants to Canva designs, assets, exports, and comments so creative work can be discussed, revised, and prepared from conversation.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://www.canva.dev/docs/mcp/)
category: design
tags:
  - design
  - remote-mcp
official: true
registry_name: com.canva.mcp/mcp
docs_url: https://www.canva.dev/docs/mcp/
endpoints:
  - url: https://mcp.canva.com/mcp
    transport: streamable-http
    auth: oauth
