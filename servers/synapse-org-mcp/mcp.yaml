name: Synapse.org
summary: Synapse.org is a collaborative research platform for scientific datasets and projects. Its remote MCP server lets assistants search genomics, imaging, clinical, and disease research data, navigate project hierarchies, and inspect metadata and provenance.
description: |-
  Synapse.org is a collaborative research platform for scientific datasets and projects. Its remote MCP server lets assistants search genomics, imaging, clinical, and disease research data, navigate project hierarchies, and inspect metadata and provenance.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://github.com/susheel/synapse-mcp?tab=readme-ov-file)
category: database
tags:
  - database
  - remote-mcp
official: true
docs_url: https://github.com/susheel/synapse-mcp?tab=readme-ov-file
endpoints:
  - url: https://mcp.synapse.org/mcp
    transport: streamable-http
    auth: oauth
