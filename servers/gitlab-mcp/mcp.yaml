name: GitLab
summary: GitLab connects AI tools securely to repository, issue, merge request, and DevSecOps data. Its connector gives assistants GitLab project context for understanding code work, collaboration, security workflows, and delivery status.
description: |-
  GitLab connects AI tools securely to repository, issue, merge request, and DevSecOps data. Its connector gives assistants GitLab project context for understanding code work, collaboration, security workflows, and delivery status.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://docs.gitlab.com/user/gitlab_duo/model_context_protocol/mcp_server/)
category: version-control
tags:
  - remote-mcp
  - version-control
official: true
registry_name: com.gitlab/mcp
docs_url: https://docs.gitlab.com/user/gitlab_duo/model_context_protocol/mcp_server/
endpoints:
  - url: https://gitlab.com/api/v4/mcp
    transport: streamable-http
    auth: oauth
