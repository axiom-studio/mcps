name: BioRender
summary: BioRender is a platform for creating publication-quality scientific figures and illustrations. Its remote MCP server connects assistants to BioRender's icon library and figure tools so scientific visuals can be drafted and refined as part of research workflows.
description: |-
  BioRender is a platform for creating publication-quality scientific figures and illustrations. Its remote MCP server connects assistants to BioRender's icon library and figure tools so scientific visuals can be drafted and refined as part of research workflows.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/biorender)
category: design
tags:
  - design
  - remote-mcp
official: true
docs_url: https://claude.com/connectors/biorender
endpoints:
  - url: https://mcp.services.biorender.com/mcp
    transport: streamable-http
    auth: oauth
