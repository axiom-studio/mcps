name: Klaviyo
summary: Klaviyo is a marketing automation platform for email, SMS, and customer data. Its remote MCP server lets assistants report on campaign performance, segment and inspect profiles, and manage marketing workflows grounded in live Klaviyo account data.
description: |-
  Klaviyo is a marketing automation platform for email, SMS, and customer data. Its remote MCP server lets assistants report on campaign performance, segment and inspect profiles, and manage marketing workflows grounded in live Klaviyo account data.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://developers.klaviyo.com/en/docs/klaviyo_mcp_server)
category: marketing
tags:
  - marketing
  - remote-mcp
official: true
docs_url: https://developers.klaviyo.com/en/docs/klaviyo_mcp_server
endpoints:
  - url: https://mcp.klaviyo.com/mcp
    transport: streamable-http
    auth: oauth
