name: PlanetScale
summary: PlanetScale provides authenticated access to Postgres and MySQL databases. Its connector gives assistants database context for inspecting schema, understanding environments, and planning data-related work with connected database systems.
description: |-
  PlanetScale provides authenticated access to Postgres and MySQL databases. Its connector gives assistants database context for inspecting schema, understanding environments, and planning data-related work with connected database systems.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://planetscale.com/docs/mcp-server.md)
category: database
tags:
  - database
  - remote-mcp
official: true
registry_name: io.github.planetscale/mcp-server
docs_url: https://planetscale.com/docs/mcp-server.md
endpoints:
  - url: https://mcp.pscale.dev/mcp/planetscale
    transport: streamable-http
    auth: oauth
