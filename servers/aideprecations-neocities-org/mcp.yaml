name: AI Deprecations
summary: 'Free, sourced calendar of AI model shutdown and deprecation dates across OpenAI, Anthropic, Gemini, Vertex, Azure, Bedrock, Mistral and Cohere. Remote MCP server (streamable HTTP, no auth) with 7 tools: get_shutdown_date, list_upcoming, search_models, get_provider, get_changes_since, subscribe_alerts, unsubscribe. Agents can subscribe to webhook alerts when a model they use gets a retirement date.'
