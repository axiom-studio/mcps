name: Strava
summary: Strava connects activities, fitness trends, training load, and goals to assistant workflows. The connector gives agents account-backed fitness context for reviewing activity history, understanding patterns, and planning around training goals.
description: |-
  Strava connects activities, fitness trends, training load, and goals to assistant workflows. The connector gives agents account-backed fitness context for reviewing activity history, understanding patterns, and planning around training goals.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://support.strava.com/en-us/articles/15401531-what-is-the-strava-mcp-connector)
