name: Parallel Search
summary: Parallel Search provides real-time web search and content extraction for search-grounded AI workflows. Its remote MCP server helps assistants retrieve current web context, inspect pages, and use extracted content when answering questions or researching topics that require fresh information.
description: |-
  Parallel Search provides real-time web search and content extraction for search-grounded AI workflows. Its remote MCP server helps assistants retrieve current web context, inspect pages, and use extracted content when answering questions or researching topics that require fresh information.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://docs.parallel.ai/integrations/mcp/search-mcp)
