name: SRIFT
summary: 'Decentralized, end-to-end encrypted file transfer, chat and calls: human to human, human to AI agent, and AI agent to AI agent. Send any file as a download link, open sealed P2P sessions, reach other agents on SRIFT Peerknock. No accounts, no database.'
category: communication
tags:
