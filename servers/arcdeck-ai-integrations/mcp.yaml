name: Arcdeck
summary: Create presentation decks from Claude, Cursor or any MCP client. Give a topic, notes or a document; Arcdeck drafts a storyline, writes and designs the slides, and returns an editor link plus editable PowerPoint and PDF downloads. Remote server with OAuth sign-in.
