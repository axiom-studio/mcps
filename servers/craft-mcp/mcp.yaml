name: Craft
summary: Craft helps users create structured documents, manage tasks, and organize a personal knowledge base. Its connector gives assistants a persistent workspace for saving research, drafting content, tracking to-dos, and arranging information into folders.
description: |-
  Craft helps users create structured documents, manage tasks, and organize a personal knowledge base. Its connector gives assistants a persistent workspace for saving research, drafting content, tracking to-dos, and arranging information into folders.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/craft)
category: productivity
tags:
