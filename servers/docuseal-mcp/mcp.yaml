name: DocuSeal
summary: DocuSeal is an electronic signature platform for document templates and submissions. Its remote MCP server lets assistants find templates, turn uploaded PDFs into signable forms, email documents to signers, and track pending or completed submissions.
description: |-
  DocuSeal is an electronic signature platform for document templates and submissions. Its remote MCP server lets assistants find templates, turn uploaded PDFs into signable forms, email documents to signers, and track pending or completed submissions.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/docuseal)
category: other
tags:
  - other
  - remote-mcp
official: true
docs_url: https://claude.com/connectors/docuseal
endpoints:
  - url: https://docuseal.com/mcp
    transport: streamable-http
    auth: oauth
