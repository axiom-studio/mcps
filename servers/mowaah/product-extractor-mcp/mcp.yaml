name: Product Page Extractor
summary: 'Turn a product page URL, or raw HTML you already have, into clean JSON: price, currency, stock, SKU/GTIN/MPN, images, rating and every offer. Each result says where the price came from (price_source), so agents can tell a structured price from a guess. Optional LLM-ready Markdown. Free keyless demo.'
