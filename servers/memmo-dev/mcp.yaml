name: Memmo
summary: Memmo gives AI coding agents the memory of the team. Sessions and merged pull requests propose memories (rules, decisions, risks, past failures); a person approves them; approved memories are served to Claude Code, Codex, Cursor or any MCP client, and ground pull request reviews.
