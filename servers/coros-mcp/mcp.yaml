name: COROS
summary: COROS is a sports technology company making GPS watches and training tools for endurance athletes. Its remote MCP server bridges COROS training history into assistant workflows, giving access to workout records, fitness metrics like VO2max and training load, and daily health data such as sleep, heart rate, and HRV.
description: |-
  COROS is a sports technology company making GPS watches and training tools for endurance athletes. Its remote MCP server bridges COROS training history into assistant workflows, giving access to workout records, fitness metrics like VO2max and training load, and daily health data such as sleep, heart rate, and HRV.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://coros.com/us/stories/coros-metrics/c/mcp-testing)
