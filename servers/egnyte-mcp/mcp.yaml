name: Egnyte
summary: Egnyte is a governed content collaboration platform for secure files and business documents. Its connector gives assistants permission-aware access to Egnyte content for search, review, summarization, and knowledge work.
description: |-
  Egnyte is a governed content collaboration platform for secure files and business documents. Its connector gives assistants permission-aware access to Egnyte content for search, review, summarization, and knowledge work.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/egnyte)
category: cloud-storage
tags:
