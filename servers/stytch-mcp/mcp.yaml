name: Stytch
summary: Stytch is an authentication and identity platform for applications. Its remote MCP server lets assistants manage project configuration such as redirect URLs and email templates, bringing common workspace administration tasks into development workflows.
description: |-
  Stytch is an authentication and identity platform for applications. Its remote MCP server lets assistants manage project configuration such as redirect URLs and email templates, bringing common workspace administration tasks into development workflows.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://stytch.com/docs/resources/workspace-management/stytch-mcp-server.md)
category: development
tags:
  - development
  - remote-mcp
official: true
docs_url: https://stytch.com/docs/resources/workspace-management/stytch-mcp-server.md
endpoints:
  - url: https://mcp.stytch.dev/mcp
    transport: streamable-http
    auth: oauth
