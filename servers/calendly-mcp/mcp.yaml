name: Calendly
summary: Calendly is a scheduling platform for booking meetings without back-and-forth email. Its remote MCP server lets assistants check availability, look up scheduled events, and manage booking links using the calendar setup users already maintain in Calendly.
description: |-
  Calendly is a scheduling platform for booking meetings without back-and-forth email. Its remote MCP server lets assistants check availability, look up scheduled events, and manage booking links using the calendar setup users already maintain in Calendly.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://calendly.com/help/connect-calendly-to-your-ai-tools)
category: productivity
tags:
  - productivity
  - remote-mcp
official: true
docs_url: https://calendly.com/help/connect-calendly-to-your-ai-tools
endpoints:
  - url: https://mcp.calendly.com
    transport: streamable-http
    auth: oauth
