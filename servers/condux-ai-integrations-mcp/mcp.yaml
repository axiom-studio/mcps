name: Condux
summary: Lets an AI agent debug from what actually broke in production. Connected to a Condux project, it can search the project's issues with the dashboard's own filters, open one with its latest stack trace and page through past occurrences. Tokens are scoped to a single project and read only by default
category: development
tags:
  - debugging
  - development
  - monitoring
  - observability-incident
docs_url: https://condux.ai/integrations/mcp/
endpoints:
  - url: https://app.condux.ai/api/mcp
    transport: streamable-http
    auth: api-key
