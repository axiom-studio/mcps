name: ContrastKit
summary: Check text and background colors against WCAG 2.x AA and AAA, get the nearest accessible color, convert CSS colors and check a whole palette of up to 12 colors. Free, with no sign-up and no API key; about 60 checks per minute per IP. Nothing you submit is stored. ContrastKit is not affiliated with the W3C or WebAIM.
category: development
tags:
