name: SignNow
summary: SignNow is an e-signature platform for sending, signing, and managing documents. Its remote MCP server connects assistants to signing workflows so documents can be prepared, sent for signature, and tracked without switching tools.
description: |-
  SignNow is an e-signature platform for sending, signing, and managing documents. Its remote MCP server connects assistants to signing workflows so documents can be prepared, sent for signature, and tracked without switching tools.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://docs.signnow.com/docs/mcp-server)
category: productivity
tags:
