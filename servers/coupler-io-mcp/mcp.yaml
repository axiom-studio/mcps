name: Coupler.io
summary: Coupler.io connects marketing, sales, finance, ecommerce, and other business data from hundreds of sources. Its connector lets assistants query Coupler.io data flows, transform raw platform metrics, and turn multi-channel information into analysis-ready business insight.
description: |-
  Coupler.io connects marketing, sales, finance, ecommerce, and other business data from hundreds of sources. Its connector lets assistants query Coupler.io data flows, transform raw platform metrics, and turn multi-channel information into analysis-ready business insight.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/coupler-io)
