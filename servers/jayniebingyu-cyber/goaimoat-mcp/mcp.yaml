name: GoAI Moat - Decision-Maker Lookup
summary: Find the person to contact at a company, then get a verified work email. Searching is free (Hunter-backed, returns decision-maker, phone and LinkedIn flags); you only pay to reveal the contacts you pick. Hosted endpoint, free 3 calls per email.
category: marketing
tags:
  - crm
  - email-automation
  - marketing
  - sales
docs_url: https://github.com/jayniebingyu-cyber/goaimoat-mcp
endpoints:
  - url: https://scrape.mcp.goaimoat.com/mcp
    transport: streamable-http
    auth: unknown
  - url: https://contacts.mcp.goaimoat.com/mcp
    transport: streamable-http
    auth: unknown
