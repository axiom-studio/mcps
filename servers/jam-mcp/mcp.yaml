name: Jam
summary: Jam captures screen recordings and automatic context for issue reports. Its connector gives assistants bug-report context, reproduction details, and recorded evidence for debugging and product-feedback workflows.
description: |-
  Jam captures screen recordings and automatic context for issue reports. Its connector gives assistants bug-report context, reproduction details, and recorded evidence for debugging and product-feedback workflows.

