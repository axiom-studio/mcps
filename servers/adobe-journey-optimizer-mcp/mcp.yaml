name: Adobe Journey Optimizer
summary: Adobe Journey Optimizer helps teams inspect, summarize, and troubleshoot journeys, campaigns, offers, and channel configurations. Its MCP connector turns AJO retrieve APIs into plain-language context for reviewing statuses, finding draft issues, and understanding orchestration portfolios.
