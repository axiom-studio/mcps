name: Lumin
summary: Lumin helps users manage documents, send signature requests, and convert Markdown to PDF. Its connector gives assistants document-workflow context for preparing files, handling signatures, and producing shareable outputs.
description: |-
  Lumin helps users manage documents, send signature requests, and convert Markdown to PDF. Its connector gives assistants document-workflow context for preparing files, handling signatures, and producing shareable outputs.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://developers.luminpdf.com/tabs/mcp/client)
