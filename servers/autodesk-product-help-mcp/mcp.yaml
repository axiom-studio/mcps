name: Autodesk Product Help
summary: Autodesk Product Help connects AI agents to Autodesk official product documentation across more than 110 products. The read-only MCP server helps assistants search, navigate, and retrieve trusted help content for product questions, onboarding, and support workflows.
description: |-
  Autodesk Product Help connects AI agents to Autodesk official product documentation across more than 110 products. The read-only MCP server helps assistants search, navigate, and retrieve trusted help content for product questions, onboarding, and support workflows.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/autodesk-product-help)
