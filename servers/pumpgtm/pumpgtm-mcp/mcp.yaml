name: PumpGTM MCP server
summary: PumpGTM is a hosted MCP server that lets Claude, ChatGPT, Cursor, Codex or any AI agent find buyers showing intent, run LinkedIn, email and X outreach from your own accounts inside each platform's limits, and hand every reply back to a human. Sign in with OAuth; no API key is needed for AI clients.
