name: MDN
summary: MDN provides documentation for open web technologies including HTML, CSS, JavaScript, Web APIs, and browser compatibility data. Its experimental remote MCP server gives assistants current web platform context for answering implementation and browser-support questions.
description: |-
  MDN provides documentation for open web technologies including HTML, CSS, JavaScript, Web APIs, and browser compatibility data. Its experimental remote MCP server gives assistants current web platform context for answering implementation and browser-support questions.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://developer.mozilla.org/en-US/mcp)
