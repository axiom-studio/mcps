name: Conductor
summary: Conductor is a platform for running coding agents in isolated cloud workspaces. Its hosted MCP server lets assistants create workspaces, start agent sessions, follow their progress, and read results using the organization you sign in with.
description: |-
  Conductor is a platform for running coding agents in isolated cloud workspaces. Its hosted MCP server lets assistants create workspaces, start agent sessions, follow their progress, and read results using the organization you sign in with.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://www.conductor.build/docs/api/mcp)
category: development
tags:
  - development
  - remote-mcp
official: true
docs_url: https://www.conductor.build/docs/api/mcp
endpoints:
  - url: https://api.conductor.build/mcp
    transport: streamable-http
    auth: oauth
