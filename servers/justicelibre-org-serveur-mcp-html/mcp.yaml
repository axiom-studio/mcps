name: JusticeLibre
summary: 'Free, no-signup access to French and European law for AI assistants: over 3 million court decisions (Conseil d''État, administrative courts, Cour de cassation, judicial courts, Conseil constitutionnel, ECHR, CJEU), 1.8 million consolidated statute articles with their version history, the Journal officiel, CADA and CNIL opinions. Every result links to its official source. Run by a French non-profit association.'
