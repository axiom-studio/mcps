name: PagerDuty
summary: PagerDuty is an operations platform for incident response, on-call management, and event intelligence. Its remote MCP server lets assistants manage incidents, create services, schedule overrides, and check rotations using live PagerDuty account data.
description: |-
  PagerDuty is an operations platform for incident response, on-call management, and event intelligence. Its remote MCP server lets assistants manage incidents, create services, schedule overrides, and check rotations using live PagerDuty account data.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/pagerduty)
category: development
tags:
