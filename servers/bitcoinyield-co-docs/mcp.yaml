name: BitcoinYield
summary: 'Live crypto yields for Bitcoin, stablecoins, ETH and SOL across DeFi and CeFi, with the best proven rate at each A-D risk grade. Two read-only tools: list_yields (the best yield per asset, by grade) and list_offers (the top offers for one asset, filterable by chain and risk). No API key.'
