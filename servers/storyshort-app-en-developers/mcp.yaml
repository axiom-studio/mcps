name: StoryShort MCP (storyshort.app)
summary: 'Remote MCP server for StoryShort (storyshort.app), an AI faceless story-video maker. Lets agents turn stories, scripts or topics into faceless vertical videos with AI scenes, narration and synced captions via your StoryShort account. Streamable HTTP endpoint https://storyshort.app/api/mcp, authenticated with a StoryShort API key (Authorization: Bearer). Not affiliated with StoryShort.ai.'
category: other
tags:
