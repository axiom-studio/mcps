name: OleaDesk Mail
summary: OleaDesk Mail connects the email you already have (Gmail, Outlook, any IMAP mailbox) to the AI you already use, through MCP. Your mail stays on your own Windows computer. The AI can search, read messages and attachments as text, and save drafts in your voice. Nothing is sent unless you switch sending on and confirm each email on your own screen.
category: communication
tags:
