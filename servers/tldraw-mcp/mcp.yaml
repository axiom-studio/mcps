name: tldraw
summary: tldraw is a collaborative whiteboard and canvas SDK. Its remote MCP server lets assistants draw and edit diagrams — flowcharts, architecture sketches, wireframes — on a live tldraw canvas while you work.
description: |-
  tldraw is a collaborative whiteboard and canvas SDK. Its remote MCP server lets assistants draw and edit diagrams — flowcharts, architecture sketches, wireframes — on a live tldraw canvas while you work.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/tldraw)
category: design
tags:
  - design
  - remote-mcp
official: true
registry_name: io.github.tldraw/tldraw
docs_url: https://claude.com/connectors/tldraw
endpoints:
  - url: https://tldraw-mcp-app.tldraw.workers.dev/mcp
    transport: streamable-http
    auth: none
