name: Miro
summary: Miro is a visual collaboration workspace for boards, brainstorming, and team alignment. Its connector lets assistants access and create Miro content so planning, diagrams, and collaborative artifacts can move through conversation.
description: |-
  Miro is a visual collaboration workspace for boards, brainstorming, and team alignment. Its connector lets assistants access and create Miro content so planning, diagrams, and collaborative artifacts can move through conversation.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/miro)
category: productivity
tags:
