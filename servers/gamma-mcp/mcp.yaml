name: Gamma
summary: Gamma is an AI-native tool for creating presentations, documents, and simple websites from prompts. Its remote MCP server lets assistants generate and edit Gamma content directly, turning ideas and outlines into polished, shareable decks and pages.
description: |-
  Gamma is an AI-native tool for creating presentations, documents, and simple websites from prompts. Its remote MCP server lets assistants generate and edit Gamma content directly, turning ideas and outlines into polished, shareable decks and pages.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/gamma)
category: design
tags:
