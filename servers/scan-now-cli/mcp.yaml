name: Scan.now
summary: Run passive, read-only website security scans and inspect suspicious public links for phishing signals. Checks include TLS, security headers, DNS and email posture, JavaScript libraries, redirects, and lookalike domains. Website scans require ownership or explicit permission.
category: development
tags:
