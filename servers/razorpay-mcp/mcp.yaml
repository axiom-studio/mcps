name: Razorpay
summary: Razorpay is a full-stack payments platform for businesses in India. Its remote MCP server lets assistants query payments, orders, refunds, and settlement data directly from a merchant account for support and finance workflows.
description: |-
  Razorpay is a full-stack payments platform for businesses in India. Its remote MCP server lets assistants query payments, orders, refunds, and settlement data directly from a merchant account for support and finance workflows.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/razorpay)
category: finance
tags:
  - finance
  - remote-mcp
official: true
docs_url: https://claude.com/connectors/razorpay
endpoints:
