name: GetMattered
summary: Job search plugin for ChatGPT and Claude. Finds jobs that fit your resume, tailors the resume and cover letter for each role, and applies on the employer's own hiring system across 30+ hiring systems. An application counts as sent only when the employer's system confirms it.
