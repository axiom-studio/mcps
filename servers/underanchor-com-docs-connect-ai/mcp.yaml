name: Underanchor
summary: Search your own PDF library and write LaTeX with every claim anchored to the exact paragraph of its source PDF. Cites with a link to the highlighted paragraph, flags unsupported sentences and lets your supervisor review text and sources side by side. OAuth sign-in, read-only or read-and-write.
category: productivity
tags:
