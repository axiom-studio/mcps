name: MoSPI
summary: MoSPI is India's Ministry of Statistics and Programme Implementation. Its public remote MCP server exposes official datasets covering GDP, inflation, employment, industry, education, health, energy, environment, and trade through natural-language queries.
description: |-
  MoSPI is India's Ministry of Statistics and Programme Implementation. Its public remote MCP server exposes official datasets covering GDP, inflation, employment, industry, education, health, energy, environment, and trade through natural-language queries.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/mospi)
category: other
tags:
  - other
  - remote-mcp
official: true
docs_url: https://claude.com/connectors/mospi
endpoints:
  - url: https://mcp.mospi.gov.in/
    transport: streamable-http
    auth: none
