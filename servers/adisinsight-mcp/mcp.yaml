name: AdisInsight
summary: AdisInsight provides pharmaceutical drug and clinical trial intelligence powered by Springer Nature. Its MCP connector gives assistants context for exploring drug pipelines, clinical trials, competitive landscapes, development history, adverse events, and regulatory milestones.
