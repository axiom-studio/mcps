name: Blinkbox
summary: Open-source automation platform (Zapier / Make / n8n alternative) exposed as an MCP server. Agents list, create, run, activate and debug workflows across 250+ integrations, headless Chromium scraping and sandboxed JS nodes; ships a SKILL.md with the node catalog and expression syntax. Hosted (free tier, API key) or self-host.
category: productivity
tags:
