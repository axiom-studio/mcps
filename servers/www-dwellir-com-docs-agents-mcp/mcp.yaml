name: Dwellir
summary: Hosted MCP server for blockchain RPC across 150+ networks. Agents query chain state (EVM, Substrate, Solana, Bitcoin, Starknet, Sui), read Hyperliquid market data, sample WebSocket streams, check RPC usage, and manage Dwellir API keys. OAuth browser login, read-only chain access, no API key in client config.
category: development
tags:
