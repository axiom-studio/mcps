name: motionprompts
summary: MCP server over a catalog of production-grade GSAP and WebGL motion components. Your agent can plan a page's sections, pick a mechanic for each one, get composition rules so animations don't fight each other, and fetch build prompts validated against live demos. Hosted at motionprompts.dev/mcp or local with npx motionprompts-mcp.
category: design
tags:
