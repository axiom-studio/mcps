name: Sybill
summary: Sybill is a revenue intelligence platform that unifies call transcripts, summaries, MEDDIC scores, emails, and CRM records. Its remote MCP server lets assistants prepare for meetings, surface action items, identify deal risk, and analyze pipeline patterns.
description: |-
  Sybill is a revenue intelligence platform that unifies call transcripts, summaries, MEDDIC scores, emails, and CRM records. Its remote MCP server lets assistants prepare for meetings, surface action items, identify deal risk, and analyze pipeline patterns.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://api.sybill.ai/docs/mcp.html)
category: communication
tags:
