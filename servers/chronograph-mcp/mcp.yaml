name: Chronograph
summary: Chronograph connects private-investment portfolio data to assistant workflows. Its connector lets users query portfolio information, analyze investments, search entities, retrieve performance metrics, and access Chronograph help documentation from programmatic portfolio context.
description: |-
  Chronograph connects private-investment portfolio data to assistant workflows. Its connector lets users query portfolio information, analyze investments, search entities, retrieve performance metrics, and access Chronograph help documentation from programmatic portfolio context.

  An eligible provider account or plan may be required for authenticated features. Consult the official setup documentation for access requirements and client compatibility.

  [Setup documentation](https://claude.com/connectors/chronograph)
